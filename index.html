<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anpassung des Auges</title>
<link rel="stylesheet" href="eye_accommodation_simulation.css" />
</head>
<body>
<div class="wrap">
  <h1>Anpassung des Auges</h1>


  <div class="card">
    <svg class="scene" viewBox="0 0 1160 460" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="vitreousGrad" cx="40%" cy="35%" r="80%">
          <stop offset="0%" stop-color="#c3d4ec" />
          <stop offset="100%" stop-color="#93aed9" />
        </radialGradient>
        <radialGradient id="lensGrad" cx="32%" cy="28%" r="80%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="40%" stop-color="#e4f4fb" />
          <stop offset="78%" stop-color="#aed7ec" />
          <stop offset="100%" stop-color="#6fa9c9" />
        </radialGradient>
        <radialGradient id="nerveGrad" cx="30%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#c7d6ee" />
          <stop offset="100%" stop-color="#93aed9" />
        </radialGradient>
      </defs>

      <!-- optical axis -->
      <line x1="70" y1="210" x2="1160" y2="210" stroke="#8a7d5f" stroke-width="1.5" opacity="0.55" />
      <path id="originMark" fill="none" stroke="#8a7d5f" stroke-width="1.5" opacity="0.6" stroke-linejoin="round" stroke-linecap="round" />

      <!-- eyeball -->
      <g>
        <circle cx="905" cy="210" r="150" fill="var(--sclera)" stroke="var(--navy)" stroke-width="5">
          <title>Lederhaut (Sklera)</title>
        </circle>

        <circle cx="905" cy="210" r="150" fill="url(#vitreousGrad)" />
        <path d="M 905 70 A 140 140 0 0 1 905 350" fill="none" stroke="#eaf2fb" stroke-width="2.5" stroke-dasharray="8 7" opacity="0.9">
          <title>Netzhaut (Retina)</title>
        </path>

        
      </g>

      <!-- rays (populated by JS) — drawn on top of the vitreous fill so they stay visible inside the eye -->
      <g id="rayLayer" fill="none" stroke-linecap="round">
        <path id="raySolidTop" stroke="var(--ray)" stroke-width="2.5" />
        <path id="raySolidMid" stroke="var(--ray)" stroke-width="2.5" />
        <path id="rayDashTop" stroke="var(--ray)" stroke-width="2" stroke-dasharray="5 5" opacity="0.7" />
        <path id="rayDashMid" stroke="var(--ray)" stroke-width="2" stroke-dasharray="5 5" opacity="0.7" />
      </g>
      <circle id="focalDot" cx="1045" cy="210" r="5" fill="var(--ray)" stroke="#c98f1d" stroke-width="1" />

      <!-- lens (path d set dynamically) — drawn after the rays so it still reads as a solid body in front of them -->
      <path id="lensShape" fill="url(#lensGrad)" stroke="var(--navy)" stroke-width="2.5">
        <title>Augenlinse</title>
      </path>
    </svg>

    <div class="icon-row" role="group" aria-label="Objektentfernung w&auml;hlen">
      <button class="icon-btn" type="button" data-dist="500" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M4 50 L22 20 L32 34 L42 12 L60 50 Z" fill="var(--green-back)" />
          <path d="M4 50 L18 26 L26 36 L34 22 L46 50 Z" fill="var(--green-front)" />
          <path d="M32 34 L36 27 L40 27 L36 20 Z" fill="#fff" />
          <path d="M42 12 L46 20 L38 20 Z" fill="#fff" />
        </svg>
        <span class="lbl">500 m</span>
      </button>

      <button class="icon-btn" type="button" data-dist="1.5" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M20 14 C16 6 24 2 28 10" fill="none" stroke="#e8d9b8" stroke-width="4" stroke-linecap="round" />
          <path d="M44 14 C48 6 40 2 36 10" fill="none" stroke="#e8d9b8" stroke-width="4" stroke-linecap="round" />
          <ellipse cx="14" cy="30" rx="7" ry="5.2" fill="var(--brown-light)" transform="rotate(-25 14 30)" />
          <ellipse cx="50" cy="30" rx="7" ry="5.2" fill="var(--brown-light)" transform="rotate(25 50 30)" />
          <circle cx="32" cy="34" r="20" fill="var(--brown)" />
          <ellipse cx="32" cy="46" rx="11" ry="8" fill="#fdf8ee" />
          <circle cx="24" cy="32" r="2.2" fill="#2a1c10" />
          <circle cx="40" cy="32" r="2.2" fill="#2a1c10" />
          <circle cx="27" cy="47" r="1.6" fill="var(--brown-dark)" />
          <circle cx="37" cy="47" r="1.6" fill="var(--brown-dark)" />
        </svg>
        <span class="lbl">1,5 m</span>
      </button>

      <button class="icon-btn" type="button" data-dist="0.4" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 40 L29 58 M32 40 L22 50 M32 40 L24 58" fill="none" stroke="#5a8f4f" stroke-width="3" stroke-linecap="round" />
          <g fill="#f4b731">
            <ellipse cx="32" cy="18" rx="7" ry="11" />
            <ellipse cx="32" cy="18" rx="7" ry="11" transform="rotate(60 32 24)" />
            <ellipse cx="32" cy="18" rx="7" ry="11" transform="rotate(120 32 24)" />
            <ellipse cx="32" cy="18" rx="7" ry="11" transform="rotate(180 32 24)" />
            <ellipse cx="32" cy="18" rx="7" ry="11" transform="rotate(240 32 24)" />
            <ellipse cx="32" cy="18" rx="7" ry="11" transform="rotate(300 32 24)" />
          </g>
          <circle cx="32" cy="24" r="7" fill="#e8791d" />
        </svg>
        <span class="lbl">40 cm</span>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var LENS = { x: 770, y: 210, halfH: 55 };
  var AXIS_Y = 210;
  var RETINA_X = 1045;          // fixed physical retina depth along the axis
  var R = RETINA_X - LENS.x;    // lens-to-retina distance (schematic units)
  var P0 = 14;                  // schematic relaxed eye power (arbitrary units, chosen for visible effect)
  var D_MAX = 2.5;              // demand at 40 cm, used to scale lens bulge
  var BULGE_FLAT = 14;
  var BULGE_MAX = 34;
  var OBJECT = { x: 100, y: 180 };

  var DISTANCES = {
    "500": { meters: 500 },
    "1.5": { meters: 1.5 },
    "0.4": { meters: 0.4 }
  };

  var els = {
    scene: document.querySelector("svg.scene"),
    lens: document.getElementById("lensShape"),
    raySolidTop: document.getElementById("raySolidTop"),
    raySolidMid: document.getElementById("raySolidMid"),
    rayDashTop: document.getElementById("rayDashTop"),
    rayDashMid: document.getElementById("rayDashMid"),
    focalDot: document.getElementById("focalDot"),
    originMark: document.getElementById("originMark"),
    buttons: Array.prototype.slice.call(document.querySelectorAll(".icon-btn"))
  };

  function iconAxisX(btn){
    var iconSvg = btn.querySelector("svg");
    var rect = iconSvg.getBoundingClientRect();
    var pt = els.scene.createSVGPoint();
    pt.x = rect.left + rect.width / 2;
    pt.y = rect.top + rect.height / 2;
    var svgPt = pt.matrixTransform(els.scene.getScreenCTM().inverse());
    return svgPt.x;
  }

  function lerp(a, b, t){ return a + (b - a) * t; }
  function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
  function clamp01(t){ return Math.min(1, Math.max(0, t)); }

  function lensPathD(bulge){
    var cx = LENS.x, cy = LENS.y, h = LENS.halfH;
    return "M " + cx + " " + (cy-h) +
      " Q " + (cx-bulge) + " " + cy + " " + cx + " " + (cy+h) +
      " Q " + (cx+bulge) + " " + cy + " " + cx + " " + (cy-h) + " Z";
  }

  function yOnLineAtX(p0, p1, x){
    var t = (x - p0.x) / (p1.x - p0.x);
    return p0.y + t * (p1.y - p0.y);
  }

  function originMarkD(x){
    return "M " + (x - 15) + " " + AXIS_Y + " L " + x + " " + (AXIS_Y - 17) + " L " + (x + 15) + " " + AXIS_Y;
  }

  var lastBulge = BULGE_FLAT;
  var lastCrossX = RETINA_X;

  var TOP_RAY_INSET = 16; // keep the top ray off the lens rim, not grazing its very edge

  function renderRaw(bulge, crossX){
    lastBulge = bulge;
    lastCrossX = crossX;
    els.lens.setAttribute("d", lensPathD(bulge));
    els.originMark.setAttribute("d", originMarkD(OBJECT.x));

    var lensTop = { x: LENS.x, y: LENS.y - LENS.halfH + TOP_RAY_INSET };
    var lensMid = { x: LENS.x, y: LENS.y };

    // The middle ray passes straight through the lens centre, undeviated. Extending that
    // same line out to crossX gives the (mirrored, off-axis) image point every ray from
    // this object point converges to — since the object sits above the axis, the image
    // falls below it, as with any real converging lens.
    var midSlope = (lensMid.y - OBJECT.y) / (lensMid.x - OBJECT.x);
    var crossY = OBJECT.y + midSlope * (crossX - OBJECT.x);
    var crossPoint = { x: crossX, y: crossY };

    var retinaHitTopY = yOnLineAtX(lensTop, crossPoint, RETINA_X);
    var retinaHitMidY = yOnLineAtX(OBJECT, crossPoint, RETINA_X);

    els.raySolidTop.setAttribute("d",
      "M " + OBJECT.x + " " + OBJECT.y + " L " + lensTop.x + " " + lensTop.y + " L " + RETINA_X + " " + retinaHitTopY);
    els.raySolidMid.setAttribute("d",
      "M " + OBJECT.x + " " + OBJECT.y + " L " + RETINA_X + " " + retinaHitMidY);

    els.rayDashTop.setAttribute("d", "M " + RETINA_X + " " + retinaHitTopY + " L " + crossX + " " + crossY);
    els.rayDashMid.setAttribute("d", "M " + RETINA_X + " " + retinaHitMidY + " L " + crossX + " " + crossY);

    els.focalDot.setAttribute("cx", crossX);
    els.focalDot.setAttribute("cy", crossY);
  }

  // The eye's optical power is carried over between selections — it does not reset to a
  // neutral baseline every time. Looking at a NEW object with the OLD lens power is exactly
  // what produces the initial defocus, and its direction falls out naturally:
  //  - coming from a farther object (weaker lens) to a nearer one: too little power  -> the
  //    point lands BEHIND the retina, the lens then has to bulge more.
  //  - coming from a nearer object (stronger lens) to a farther one: too much power   -> the
  //    point lands IN FRONT of the retina, the lens then has to relax.
  function bulgeFromPower(power){
    return BULGE_FLAT + (BULGE_MAX - BULGE_FLAT) * clamp01((power - P0) / D_MAX);
  }
  function crossXFromPower(power, D){
    return LENS.x + (R * P0) / (power - D);
  }

  var currentKey = "0.4";
  var eyePower = P0; // current physical state of the lens; persists across selections
  var animToken = 0;

  function animateValue(from, to, duration, onFrame, onDone){
    var myToken = ++animToken;
    if (duration <= 0) {
      onFrame(to);
      if (onDone) onDone();
      return;
    }
    var start = performance.now();
    function step(now){
      if (myToken !== animToken) return;
      var t = clamp01((now - start) / duration);
      onFrame(lerp(from, to, easeInOutCubic(t)));
      if (t < 1) {
        requestAnimationFrame(step);
      } else if (onDone) {
        onDone();
      }
    }
    requestAnimationFrame(step);
  }

  function runSequence(distKey, btn){
    currentKey = distKey;
    els.buttons.forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.dist === distKey));
    });
    if (btn) OBJECT.x = iconAxisX(btn);

    var D = 1 / DISTANCES[distKey].meters;
    var oldPower = eyePower;
    var oldBulge = bulgeFromPower(oldPower);
    var startX = crossXFromPower(oldPower, D);
    // For the mountains, push the starting point a bit further in front of the retina —
    // the natural carry-over offset alone is too subtle to read clearly.
    if (distKey === "500") {
      startX -= 25;
    }
    var targetPower = P0 + D;
    var targetBulge = bulgeFromPower(targetPower);

    renderRaw(oldBulge, startX); // instant: looking at the new object through the old lens shape

    var holdDur = reduceMotion ? 0 : 500;
    var animDur = reduceMotion ? 0 : 2200;

    window.setTimeout(function(){
      animateValue(0, 1, animDur, function(t){
        renderRaw(lerp(oldBulge, targetBulge, t), lerp(startX, RETINA_X, t));
      }, function(){
        eyePower = targetPower;
      });
    }, holdDur);
  }

  els.buttons.forEach(function(btn){
    btn.addEventListener("click", function(){
      runSequence(btn.dataset.dist, btn);
    });
  });

  function defaultButton(){
    return els.buttons.filter(function(b){ return b.dataset.dist === currentKey; })[0];
  }

  OBJECT.x = iconAxisX(defaultButton());
  renderRaw(bulgeFromPower(eyePower), crossXFromPower(eyePower, 1 / DISTANCES[currentKey].meters));
  window.setTimeout(function(){ runSequence(currentKey, defaultButton()); }, reduceMotion ? 0 : 500);

  var resizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      OBJECT.x = iconAxisX(defaultButton());
      renderRaw(lastBulge, lastCrossX);
    }, 120);
  });
})();
</script>
</body>
</html>
